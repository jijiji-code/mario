<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Style Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 2 / 1;
            background-color: #5c94fc; /* Mario Sky Blue */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #000;
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: #ff0000;
            text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        p.subtitle {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            margin-bottom: 30px;
            line-height: 1.5;
            text-align: center;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            background-color: #e52521;
            color: white;
            border: 4px solid #000;
            padding: 15px 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Press Start 2P', cursive;
            color: white;
            font-size: 1.2rem;
            text-shadow: 2px 2px 0 #000;
            z-index: 5;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.2rem; }
            p.subtitle { font-size: 0.6rem; }
            button { font-size: 0.8rem; padding: 10px 20px; }
            #score-board { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="score-board">SCORE: <span id="score">0</span></div>
        
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>MARIO RUNNER</h1>
            <p class="subtitle">점프: 스페이스바, ↑ 키, 화면 터치</p>
            <button id="start-btn">게임 시작</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>GAME OVER</h1>
            <p class="subtitle" id="final-score-text">최종 점수: 0</p>
            <button id="restart-btn">다시 하기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const finalScoreText = document.getElementById('final-score-text');

        // Game Constants
        let GAME_WIDTH = 800;
        let GAME_HEIGHT = 400;
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const GROUND_HEIGHT = 50;
        
        let gameSpeed = 5;
        let score = 0;
        let animationId;
        let isPlaying = false;

        // Resize Canvas dynamically
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            GAME_WIDTH = container.clientWidth;
            GAME_HEIGHT = container.clientHeight;
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Player {
            constructor() {
                this.width = 36; // 12x15 픽셀 아트 비율(scale: 3)에 맞게 너비 수정
                this.height = 45; // 높이 수정
                this.x = 50;
                this.y = GAME_HEIGHT - GROUND_HEIGHT - this.height;
                this.dy = 0;
                this.isGrounded = true;
            }

            jump() {
                if (this.isGrounded) {
                    this.dy = JUMP_FORCE;
                    this.isGrounded = false;
                }
            }

            update() {
                this.dy += GRAVITY;
                this.y += this.dy;

                // Ground collision
                if (this.y + this.height >= GAME_HEIGHT - GROUND_HEIGHT) {
                    this.y = GAME_HEIGHT - GROUND_HEIGHT - this.height;
                    this.dy = 0;
                    this.isGrounded = true;
                }
            }

            draw() {
                // 8비트 마리오 픽셀 아트 맵 (12 x 15)
                const pixelSize = 3;
                const sprite = [
                    "    RRRRR   ",
                    "   RRRRRRRRR",
                    "   EEESESS  ",
                    "  ESESSSESSS",
                    "  ESESSEESSS",
                    "  ESEEEESSSS",
                    "    SSSSSSS ",
                    "   RROORRR  ",
                    "  RRRORRROR ",
                    " RRRROOOORRO",
                    " SSRROOOORSS",
                    " SSSROOOORSS",
                    "  OO      OO",
                    " EEE      EEE",
                    "EEEE      EEEE"
                ];
                
                // 픽셀 색상 정의
                const colors = {
                    'R': '#e52521', // 빨간색 (모자, 셔츠)
                    'E': '#8b4513', // 갈색 (머리카락, 수염, 신발)
                    'S': '#ffcc99', // 살구색 (얼굴, 손)
                    'O': '#0000ff'  // 파란색 (멜빵바지)
                };

                // 배열을 순회하며 픽셀 그리기
                for (let row = 0; row < sprite.length; row++) {
                    for (let col = 0; col < sprite[row].length; col++) {
                        const char = sprite[row][col];
                        if (colors[char]) {
                            ctx.fillStyle = colors[char];
                            ctx.fillRect(this.x + col * pixelSize, this.y + row * pixelSize, pixelSize, pixelSize);
                        }
                    }
                }
            }
        }

        class Obstacle {
            constructor() {
                this.width = 50;
                this.height = Math.random() * 40 + 40; // Random height between 40-80
                this.x = GAME_WIDTH;
                this.y = GAME_HEIGHT - GROUND_HEIGHT - this.height;
            }

            update() {
                this.x -= gameSpeed;
            }

            draw() {
                // Pipe representation (Green)
                ctx.fillStyle = '#00aa00';
                ctx.fillRect(this.x + 5, this.y, this.width - 10, this.height);
                
                // Pipe Cap
                ctx.fillStyle = '#00cc00';
                ctx.fillRect(this.x, this.y, this.width, 20);
                
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x + 5, this.y, this.width - 10, this.height);
                ctx.strokeRect(this.x, this.y, this.width, 20);
            }
        }

        class Cloud {
            constructor() {
                this.x = GAME_WIDTH + Math.random() * 200;
                this.y = Math.random() * (GAME_HEIGHT / 2);
                this.width = 60;
                this.height = 30;
                this.speed = Math.random() * 1 + 0.5;
            }
            update() {
                this.x -= this.speed;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
                ctx.arc(this.x + 20, this.y - 10, 25, 0, Math.PI * 2);
                ctx.arc(this.x + 40, this.y, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let player;
        let obstacles = [];
        let clouds = [];
        let frames = 0;

        function init() {
            player = new Player();
            obstacles = [];
            clouds = [];
            score = 0;
            gameSpeed = 5;
            frames = 0;
            scoreElement.innerText = score;
            
            // Initial clouds
            for(let i=0; i<3; i++) {
                let c = new Cloud();
                c.x = Math.random() * GAME_WIDTH;
                clouds.push(c);
            }
        }

        function drawGround() {
            ctx.fillStyle = '#c84c0c'; // Brick color
            ctx.fillRect(0, GAME_HEIGHT - GROUND_HEIGHT, GAME_WIDTH, GROUND_HEIGHT);
            
            // Grass top
            ctx.fillStyle = '#00a800';
            ctx.fillRect(0, GAME_HEIGHT - GROUND_HEIGHT, GAME_WIDTH, 15);
        }

        function checkCollision(p, o) {
            return (
                p.x < o.x + o.width &&
                p.x + p.width > o.x &&
                p.y < o.y + o.height &&
                p.y + p.height > o.y
            );
        }

        function gameLoop() {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Update & Draw Clouds
            if (frames % 150 === 0) clouds.push(new Cloud());
            clouds.forEach((cloud, index) => {
                cloud.update();
                cloud.draw();
                if (cloud.x + cloud.width < 0) clouds.splice(index, 1);
            });

            drawGround();

            // Update & Draw Obstacles
            if (frames % Math.floor(Math.random() * 60 + 60) === 0) {
                obstacles.push(new Obstacle());
            }

            obstacles.forEach((obs, index) => {
                obs.update();
                obs.draw();

                if (checkCollision(player, obs)) {
                    gameOver();
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(index, 1);
                    score += 10;
                    scoreElement.innerText = score;
                    if(score % 100 === 0) gameSpeed += 0.5; // Increase difficulty
                }
            });

            player.update();
            player.draw();

            frames++;
            animationId = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            init();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            isPlaying = true;
            gameLoop();
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationId);
            finalScoreText.innerText = `최종 점수: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        // Controls
        function handleInput(e) {
            if (!isPlaying) return;
            
            // 버튼을 눌렀을 때는 점프하지 않도록 예외 처리
            if (e.target.tagName.toLowerCase() === 'button') return;

            if (e.type === 'keydown' && (e.code === 'Space' || e.code === 'ArrowUp')) {
                player.jump();
            }
            if (e.type === 'touchstart' || e.type === 'mousedown') {
                player.jump();
            }
        }

        window.addEventListener('keydown', handleInput);
        document.addEventListener('touchstart', handleInput, {passive: true});
        document.addEventListener('mousedown', handleInput);

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
